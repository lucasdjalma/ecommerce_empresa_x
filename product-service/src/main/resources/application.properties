spring.application.name=product-service
server.port=8081

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/productdb?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:ecommerce}
spring.datasource.password=${MYSQL_PASSWORD:ecommerce}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.product-exchange=product.exchange
app.rabbitmq.stock-queue=stock.queue
app.rabbitmq.product-created-routing-key=product.created
app.rabbitmq.stock-deleted-queue=stock.product-deleted.queue
app.rabbitmq.product-deleted-routing-key=product.deleted
